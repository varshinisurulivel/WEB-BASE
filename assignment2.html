<html>
<head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.resume{
    width:900px;
    display:flex;
    background:white;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* Navigation Sidebar */
nav{
    width:35%;
    background:#f7e9ec;
    padding:25px;
}

.profile{
    text-align:center;
    margin-bottom:25px;
}

.profile img{
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid white;
}

.section{
    margin-top:25px;
}

.section h3{
    color:#d85b84;
    font-size:18px;
    margin-bottom:10px;
    border-bottom:2px solid #d9a8b7;
    padding-bottom:5px;
}

.section ul{
    margin-left:20px;
}

.section ul li{
    margin-bottom:8px;
    font-size:14px;
}

/* Right Content */
.content{
    width:65%;
    padding:30px;
}

.name{
    font-size:50px;
    color:#d85b84;
    font-weight:bold;
}

.surname{
    font-size:50px;
    font-weight:bold;
    color:black;
}

.role{
    color:#d85b84;
    margin-top:5px;
    margin-bottom:20px;
}

.content-section{
    margin-top:25px;
}

.content-section h2{
    color:#d85b84;
    border-bottom:2px solid #e5c1cb;
    padding-bottom:5px;
    margin-bottom:10px;
}

.content-section p,
.content-section li{
    font-size:15px;
    line-height:1.6;
}

.content-section ul{
    margin-left:20px;
}

.education-item{
    margin-bottom:15px;
}

.education-item strong{
    color:#d85b84;
}
</head>
</style>
</head>
<body>
<div class="resume">

    <nav>
        <div class="profile">
            <img src="profile.jpg" alt="Profile">
        </div>

        <div class="section">
            <h3>CONTACT</h3>
            <p>aaliyasharma@email.com</p>
            <p>9876543210</p>
            <p>Bangalore, India</p>
        </div>

        <div class="section">
            <h3>SKILLS</h3>
            <ul>
                <li>Communication</li>
                <li>Time Management</li>
                <li>Problem Solving</li>
                <li>Teamwork</li>
            </ul>
        </div>

        <div class="section">
            <h3>LANGUAGES</h3>
            <ul>
                <li>English</li>
                <li>Hindi</li>
                <li>Kannada</li>
            </ul>
        </div>
    </nav>

    <div class="content">
        <!-- Objective, Education, Projects, Achievements -->
    </div>

</div>
</body>
</html>
