<html>
<head>
<title>Registration From</title>
</head>
<body bgcolor="grey">
<h2><b><center>Student Registration Form</b></center></h2>
<form>
<table cellpadding="5">
<tr>
<td><label for="name">FirstName:</label></td>
<td><input type="text" placeholder="Enter your name" id="name"></td>
<td><label for="name">LastName:</label></td>
<td><input type="text" placeholder="Enter your name" id="name"></td>
</tr>

<tr>
<td><label for="fathername">Father's Name:</label></td>
<td><input type="text" placeholder=" " id="fathername"></td>
</tr>

<tr>
    <td><label for="dob">Date of Birth:</label></td>
    <td><input type="date" id="dob" placeholder="DOB"</td>
</tr>


<tr>
<td><label for="age">Age:</label></td>
<td><input type="number" id="age"></td>
</tr>


<tr>
<td><label for="gender">Gender:</label></td>
<td><input type="radio" name="gender" id="gender">Male
<input type="radio" name="gender" id="gender">Female</td>
</tr>


<tr>
<td><label for="email">Email:</label></td>
<td><input type="email" placeholder="Enter your email" id="email"></td>
</tr>

<tr>
    <td><label for="Phoneno">Phone No:</label></td>
    <td><input type="number" placeholder=" " id="Phoneno"></td>
</tr>

<tr>
    <td><label>Hobbies:</label></td>
<td>
<input type="checkbox" id="Reading" name="dept" value="Reading">
<label for="Reading">Reading</label>

<input type="checkbox" id="Cooking" name="dept" value="Cooking">
<label for="Cooking">Cooking</label>

<input type="checkbox" id="Dancing" name="dept" value="Dancing">
<label for="Dancing">Dancing</label>

<input type="checkbox" id="Games" name="dept" value="Games">
<label for="Games">Games</label>
</td>
</tr>

<tr>
    <td><label>Course:</label></td>
    <td> 
    <select>
    <option>CSE</option>
    <option>ECE</option>
    <option>IT</option>
    </select>
    </td> 
</tr>

<tr>
    <td><label for="city">City:</label></td>
    <td><input type="text" placeholder=" " id="city"></td>
</tr>

<tr>
    <td><label>Address:</label></td>
    <td><textarea name="address" rows="4" cols="30" placeholder=" "></textarea></td>
</tr>

<tr>
<td><input type="submit" value="Register"></td>
</tr>
</table>
</form>
</body>
</html>
